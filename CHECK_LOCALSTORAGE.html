<!DOCTYPE html>
<html>
<head>
    <title>Check localStorage</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        pre {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            overflow: auto;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px 5px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <h1>localStorage Debug Tool</h1>
    
    <button onclick="checkStorage()">Check Storage</button>
    <button onclick="clearStorage()">Clear All Storage</button>
    
    <h2>Results:</h2>
    <pre id="output">Click "Check Storage" to see localStorage contents...</pre>
    
    <script>
        function checkStorage() {
            const output = document.getElementById('output');
            let result = '=== localStorage Contents ===\n\n';
            
            // Check guest trips
            const guestTrips = localStorage.getItem('travel_blog_guest_trips');
            result += '1. travel_blog_guest_trips:\n';
            if (guestTrips) {
                try {
                    const parsed = JSON.parse(guestTrips);
                    result += `   Found ${parsed.length} trip(s)\n`;
                    result += JSON.stringify(parsed, null, 2) + '\n\n';
                } catch (e) {
                    result += '   ERROR: Invalid JSON\n\n';
                }
            } else {
                result += '   NOT FOUND (null)\n\n';
            }
            
            // Check for user cache keys
            result += '2. User cache keys:\n';
            let foundUserCache = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('travel_blog_user_cache_')) {
                    foundUserCache = true;
                    const value = localStorage.getItem(key);
                    result += `   ${key}:\n`;
                    if (value) {
                        try {
                            const parsed = JSON.parse(value);
                            result += `   Found ${parsed.length} trip(s)\n`;
                            result += JSON.stringify(parsed, null, 2) + '\n\n';
                        } catch (e) {
                            result += '   ERROR: Invalid JSON\n\n';
                        }
                    }
                }
            }
            if (!foundUserCache) {
                result += '   No user cache keys found\n\n';
            }
            
            // List all keys
            result += '3. All localStorage keys:\n';
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                result += `   - ${key}\n`;
            }
            
            output.textContent = result;
        }
        
        function clearStorage() {
            if (confirm('Are you sure you want to clear ALL localStorage? This will delete all your trips!')) {
                localStorage.clear();
                alert('localStorage cleared!');
                checkStorage();
            }
        }
        
        // Auto-check on load
        window.onload = checkStorage;
    </script>
</body>
</html>
